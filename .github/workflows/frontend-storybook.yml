name: Frontend Storybook

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-storybook.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-storybook.yml'
  workflow_dispatch:

concurrency:
  group: frontend-storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  storybook:
    # Pinned to ubuntu-26.04 for parity with backend-rs.yml (see that
    # workflow's header note: `ubuntu-latest` migrated 24.04 -> 26.04 on
    # 2026-11-19). No env-sensitive gate here, but pinning keeps CI
    # reproducible and aligned with the containerization bundle.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules/.cache/storybook
          key: storybook-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --force

      - name: Build Storybook
        run: npm run build-storybook

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test Storybook
        run: npm run test-storybook
