[package]
name = "backend-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio-rustls", "chrono", "migrate", "macros"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "request-id", "compression-full", "set-header", "limit", "fs", "sensitive-headers"] }
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["mysql"] }
tower_governor = "=0.8.0"
argon2 = "0.5"
bcrypt = "0.17"
garde = { version = "0.22", features = ["derive"] }
axum-valid = { version = "0.20", features = ["garde"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
utoipa = "5"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
time = "0.3"
dotenvy = "0.15"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
rpassword = "7"

[[test]]
name = "api"
path = "tests/api.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
