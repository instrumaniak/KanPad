# KanPad backend-rs CI (T06 docker/CI contract; RELOCATED to the repo root by
# T55).
#
# LOCATION: this file now lives at the REPO ROOT `.github/workflows/` — GitHub
# Actions discovers workflows ONLY there. It used to live at
# `backend-rs/.github/workflows/ci.yml`, one directory deep, which means it had
# **NEVER RUN**: every gate in it (fmt, clippy, the `unwrap` grep gate, the
# `prepare --check`, `cargo deny`, the openapi diff, the docker build,
# the e2e suites) was unverified. T55 moved it here (a pure path rename — the
# body already used repo-root-relative paths and `working-directory: backend-rs`).
#
# Step order is normative (T06 AC): fmt -> clippy -D warnings -> migrate run +
# migrate info (pending=0) -> SHOW CREATE TABLE assert (T02 gate) ->
# sqlx prepare --check (canonical form) -> test -> openapi snapshot ->
# gen:api --check -> tsc -> docker build (SQLX_OFFLINE=true) ->
# vitest / playwright pinned to :3001.
#
# .sqlx/ commit rule (enforced by the prepare --check step): any `query!`
# change must run `cargo sqlx prepare --workspace --all -- --all-targets` and
# commit the result. Never bake DATABASE_URL into the image; never set
# SQLX_OFFLINE in dev .env (only the Dockerfile builder sets it).

name: backend-rs CI

on:
  push:
    paths:
      - 'backend-rs/**'
      - 'frontend/**'
      # A change to THIS workflow must trigger it (T55) — otherwise the gate
      # file can drift without anything noticing.
      - '.github/workflows/backend-rs.yml'
  pull_request:
    paths:
      - 'backend-rs/**'
      - 'frontend/**'
      - '.github/workflows/backend-rs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_DB_NAME: kanpad_ci
  MYSQL_ROOT_PASSWORD: ci_root_pw
  # 10-architecture.md: DATABASE_URL always carries ?charset=utf8mb4 AND the
  # collation pin (`54` Part C §C6): sqlx 0.9 sends only `SET NAMES utf8mb4`
  # and lets the server pick the collation — MySQL 8's default is
  # `utf8mb4_0900_ai_ci`, NOT this schema's `utf8mb4_unicode_ci`.
  DATABASE_URL: mysql://root:ci_root_pw@127.0.0.1:3306/kanpad_ci?charset=utf8mb4&collation=utf8mb4_unicode_ci
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: backend (fmt -> clippy -> migrate -> prepare --check -> test -> snapshot)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kanpad_ci
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_pw"
          --health-interval=5s --health-timeout=3s --health-retries=20
          --health-start-period=20s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable + clippy + rustfmt)
        # The toolchain is PINNED by backend-rs/rust-toolchain.toml (1.99.1).
        # The `dtolnay/rust-toolchain@stable` action exported RUSTUP_TOOLCHAIN,
        # which OVERRIDES that file — so the pin was silently ignored by CI.
        # This action now installs the SAME pinned channel (T57).
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # -- 1. fmt ---------------------------------------------------------
      - name: fmt --check
        working-directory: backend-rs
        run: cargo fmt --check

      # -- 2. clippy ------------------------------------------------------
      - name: clippy --workspace --all-targets -D warnings
        working-directory: backend-rs
        # `-A clippy::pedantic` keeps `clippy::pedantic` ADVISORY: the tree
        # carries ~370 pedantic warnings (measured 2026-10-22) and the
        # `cast_*` family among them cannot be fixed without changing
        # runtime semantics. The lints table still enables it at `warn` as
        # a to-do list for a local `cargo clippy`.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic

      # -- lint grep gates (10-architecture.md code policy) ---------------
      # unwrap()/expect() are allowed ONLY at the main() boundary
      # (src/main.rs, anyhow boundary) and inside #[cfg(test)] modules
      # ("allowed in tests only"). The awk filter strips #[cfg(test)]
      # module bodies (brace-aware) before matching.
      - name: grep gate — no unwrap()/expect() outside main.rs and #[cfg(test)]
        working-directory: backend-rs
        run: |
          set -euo pipefail
          hits="$(find src -name '*.rs' ! -name 'main.rs' | while read -r f; do
            awk '
              /^[[:space:]]*#\[cfg\(test\)\]/ { skip=1; depth=0; seen=0; next }
              skip {
                line=$0
                opens = gsub(/\{/, "&", line)
                closes = gsub(/\}/, "&", line)
                if (opens > 0) { seen=1 }
                depth += opens - closes
                if (seen && depth <= 0) { skip=0 }
                next
              }
              { print FILENAME ":" FNR ":" $0 }
            ' "$f"
          done | grep -E '\.(unwrap|expect)\(' || true)"
          if [ -n "$hits" ]; then
            echo 'FAIL: unwrap()/expect() outside src/main.rs and #[cfg(test)]:'
            echo "$hits"
            exit 1
          fi
          echo 'OK: no unwrap()/expect() outside src/main.rs and #[cfg(test)]'

      # The OTHER panic spellings in a request path (54 B2, 3rd decision).
      # NOTE: `unwrap_or_else` is deliberately NOT matched — it is not a panic
      # spelling (it is used benignly 6x on the tree).
      #
      # ALLOWLIST: **none** since T65. It used to exempt `src/state.rs`, whose
      # session-store identifier guards were the one documented fail-fast (a
      # BOOT-time invariant, never per request). T65 replaced the store with an
      # IN-TREE one that interpolates no schema name, so there is no
      # identifier to validate, the guards are gone, and the allow-list entry
      # with them. An allow-list entry that outlives its reason is a hole.
      - name: grep gate — no panic!/todo!/unimplemented! outside main.rs and #[cfg(test)]
        working-directory: backend-rs
        run: |
          set -euo pipefail
          hits="$(find src -name '*.rs' ! -name 'main.rs' | while read -r f; do
            awk '
              /^[[:space:]]*#\[cfg\(test\)\]/ { skip=1; depth=0; seen=0; next }
              skip {
                line=$0
                opens = gsub(/\{/, "&", line)
                closes = gsub(/\}/, "&", line)
                if (opens > 0) { seen=1 }
                depth += opens - closes
                if (seen && depth <= 0) { skip=0 }
                next
              }
              { print FILENAME ":" FNR ":" $0 }
            ' "$f"
          done | grep -E '\b(panic!|todo!|unimplemented!)\(' || true)"
          if [ -n "$hits" ]; then
            echo 'FAIL: panic!/todo!/unimplemented! outside src/main.rs and #[cfg(test)]:'
            echo "$hits"
            exit 1
          fi
          echo 'OK: no panic!/todo!/unimplemented! outside src/main.rs and #[cfg(test)]'

      # format!-interpolated SQL is banned in store.rs (SQL must be fully
      # parameterized `?` bindings; see 00-overview.md constitution).
      #
      # T55: this gate had NEVER RUN (the workflow was undiscoverable), and
      # it failed on the current tree for two reasons — both of them the
      # gate's fault, not the code's:
      #   1. a DOC COMMENT mentioning "never `format!` of input" was matched
      #      as if it were code;
      #   2. `notes::escape_like_pattern` builds a BOUND VALUE
      #      (`format!("%{escaped}%")`, passed to `push_bind`) — that is the
      #      sanctioned LIKE-escape pattern (30-db-schema.md: "LIKE patterns
      #      built in Rust + push_bind only"), NOT SQL text.
      # The gate's real intent is "no `format!` may BUILD SQL". So it now
      # (a) skips comment lines and (b) accumulates each `format!(...)` call
      # and flags it only when the built text carries a SQL keyword.
      - name: grep gate — no format! in store.rs
        working-directory: backend-rs
        run: |
          set -euo pipefail
          hits="$(find src -name 'store.rs' | while read -r f; do
            awk '
              # skip comment lines (a doc comment mentioning format! is not code)
              { line = $0 }
              line ~ /^[[:space:]]*(\/\/|\/\*|\*)/ { next }
              {
                if (!in_fmt && line ~ /format!\(/) { in_fmt=1; buf=line; depth=0 }
                else if (in_fmt) { buf = buf " " line }
                if (in_fmt) {
                  opens = gsub(/\(/, "&", line)
                  closes = gsub(/\)/, "&", line)
                  depth += opens - closes
                  if (depth <= 0) {
                    if (buf ~ /SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|VALUES|JOIN|ORDER BY|LIMIT/) {
                      print FILENAME ":" FNR ":" buf
                    }
                    in_fmt=0; buf=""
                  }
                }
              }
            ' "$f"
          done || true)"
          if [ -n "$hits" ]; then
            echo 'FAIL: format! builds SQL in store.rs (SQL must use ? bindings):'
            echo "$hits"
            exit 1
          fi
          echo 'OK: no format!-built SQL in store.rs'

      # -- 3. migrate run + migrate info (pending=0) -----------------------
      # sqlx-cli pinned exactly as T02 specifies (NOT the backend-rs binary:
      # its `migrate` subcommand is still the T03 stub until wired later).
      - name: Cache sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-0.9.0-${{ runner.os }}

      - name: Install sqlx-cli 0.9.0
        run: |
          set -euo pipefail
          if ! command -v sqlx >/dev/null 2>&1; then
            # T66: the CLI moves with the driver — a 0.8.6 CLI cannot
            # regenerate or validate a 0.9 `.sqlx/` cache.
            cargo install sqlx-cli --version 0.9.0 --no-default-features --features mysql,rustls
          fi
          cargo sqlx --version

      - name: migrate run
        working-directory: backend-rs
        run: |
          set -euo pipefail
          cargo sqlx database create
          cargo sqlx migrate run
          cargo sqlx migrate info

      # pending=0 cross-check that does not depend on `migrate info` output
      # formatting: applied rows in the sqlx journal must equal migration files.
      - name: migrate info asserts pending=0
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mysql-client
          applied="$(mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B \
            -e 'SELECT COUNT(*) FROM _sqlx_migrations;' "$CI_DB_NAME")"
          files="$(ls backend-rs/migrations/*.sql | wc -l)"
          echo "applied=$applied files=$files"
          [ "$applied" -eq "$files" ] || { echo 'FAIL: pending migrations remain'; exit 1; }
          echo 'OK: pending=0'

      # -- 4. SHOW CREATE TABLE assert (T02 gate enforcement) --------------
      # Baseline rule (30-db-schema.md): app tables are explicit
      # ENGINE=InnoDB + utf8mb4/utf8mb4_unicode_ci (fail fast, no IF NOT EXISTS).
      #
      # T68: the store-owned session table used to get a SPECIAL CASE here,
      # because it lived in a separate `tower_sessions` schema and kept the
      # store's own DDL verbatim (no explicit ENGINE/CHARSET/COLLATE). BOTH
      # premises are gone since the 2026-10-19 store change:
      #   * the session table now lives in the APP database (`sessions`, named
      #     by the baseline migration — `migrations/0001_baseline.sql`), and
      #   * the baseline creates it with the SAME explicit
      #     `ENGINE=InnoDB DEFAULT CHARACTER SET=utf8mb4 COLLATE=utf8mb4_unicode_ci`
      #     as every other app table.
      # The special case therefore queried a schema that no longer exists
      # (`tower_sessions`), returned an empty row, and the `case` treated that
      # as a FAILURE — the step was RED on every run (T68 red-proof).
      # The general query below now covers `sessions` with no exception.
      #
      # Excluded from the general query:
      #   * `_sqlx_migrations` — sqlx-owned tooling, not app DDL.
      #   * `_sqlx_test_databases` — sqlx's `#[sqlx::test]` harness tracking
      #     table. It lives in the BASE database and inherits the SERVER
      #     default collation (utf8mb4_0900_ai_ci on MySQL 8), so it would
      #     violate the rule. It is created when the tests run, so excluding
      #     it keeps this assert correct regardless of the step order.
      - name: SHOW CREATE TABLE engine/charset/collation assert
        run: |
          set -euo pipefail
          app_bad="$(mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B -e \
            "SELECT CONCAT(TABLE_NAME, ' ', ENGINE, ' ', TABLE_COLLATION)
             FROM information_schema.TABLES
             WHERE TABLE_SCHEMA = '$CI_DB_NAME'
               AND TABLE_TYPE = 'BASE TABLE'
               AND TABLE_NAME NOT IN ('_sqlx_migrations', '_sqlx_test_databases')
               AND (ENGINE <> 'InnoDB' OR TABLE_COLLATION <> 'utf8mb4_unicode_ci');")"
          if [ -n "$app_bad" ]; then
            echo 'FAIL: app tables violating InnoDB/utf8mb4_unicode_ci:'
            echo "$app_bad"
            exit 1
          fi
          echo 'OK: all app tables are InnoDB/utf8mb4_unicode_ci'
          # The store-owned session table is an APP table now (`sessions`), so
          # the query above already asserted it. Print it for the log so a
          # regression that moves it out of the app DB is visible.
          session_row="$(mysql -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -B -e \
            "SELECT CONCAT(TABLE_NAME, ' ', ENGINE, ' ', TABLE_COLLATION)
             FROM information_schema.TABLES
             WHERE TABLE_SCHEMA = '$CI_DB_NAME' AND TABLE_NAME = 'sessions';")"
          echo "store-owned session table (app DB): $session_row"
          case "$session_row" in
            'sessions InnoDB utf8mb4_unicode_ci') echo 'OK: session table InnoDB + utf8mb4_unicode_ci' ;;
            *) echo 'FAIL: the session table must live in the app DB as InnoDB/utf8mb4_unicode_ci'; exit 1 ;;
          esac

      # -- 5. sqlx prepare --check (canonical exact form) ------------------
      - name: sqlx prepare --check --workspace --all -- --all-targets
        working-directory: backend-rs
        run: cargo sqlx prepare --check --workspace --all -- --all-targets

      # -- 6. test ---------------------------------------------------------
      - name: cargo test --workspace --all-targets
        working-directory: backend-rs
        run: cargo test --workspace --all-targets

      # -- supply-chain ----------------------------------------------------
      # T68: the separate `cargo audit` step is REMOVED. It was a SECOND
      # advisory gate with a DIFFERENT policy: `cargo-audit` reads
      # `.cargo/audit.toml` (absent) and therefore never saw the four
      # task-bound ignores in `deny.toml` — so it failed on exactly the
      # advisories the project had deliberately, and with a reason, accepted
      # (red-proof: `error: 4 vulnerabilities found!`, exit 1).
      # `cargo deny check advisories` reads the SAME RustSec advisory DB and
      # additionally checks yanked crates, honours the task-bound ignores,
      # and its policy is the committed artefact. One policy, one gate, one
      # source of truth — a second ignore list can only drift.

      # T57: the supply-chain policy is a COMMITTED artefact
      # (backend-rs/deny.toml), derived from a real `cargo deny` run — not a
      # generated default. The old `cargo deny init` fallback is GONE on
      # purpose: it silently checked a DIFFERENT policy than the one the
      # project declares. A missing deny.toml must fail the build.
      - name: cargo deny check (committed deny.toml)
        working-directory: backend-rs
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            # T68: PINNED. A `deny.toml` is schema-version-sensitive: an
            # unpinned cargo-deny release can reject a valid policy with
            # `unexpected-keys`, turning a dependency bump into a red build
            # for a reason that has nothing to do with the dependency. The
            # version is the one the policy was DERIVED against.
            cargo install --locked cargo-deny --version 0.20.2
          fi
          if [ ! -f deny.toml ]; then
            echo 'FAIL: backend-rs/deny.toml is missing — the supply-chain policy must be committed'
            exit 1
          fi
          cargo deny check advisories
          cargo deny check licenses
          cargo deny check bans

      # -- 7. openapi snapshot (ACTIVE; T40a fills DTO coverage) -----------
      # export-openapi boots NO pool/sessions, so this also proves the
      # binary builds offline. SQLX_OFFLINE=true here mirrors the Dockerfile.
      - name: openapi snapshot — export matches committed openapi.json
        working-directory: backend-rs
        run: |
          set -euo pipefail
          SQLX_OFFLINE=true cargo run --locked --offline -- export-openapi > /tmp/openapi.ci.json
          diff -u openapi.json /tmp/openapi.ci.json

  # ------------------------------------------------------------------ web
  # gen:api --check -> tsc -> vite build (dist feeds the docker image).
  web:
    name: web (gen:api --check -> tsc -> vite build)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # T40b owns `gen:api` (openapi-typescript regen from
      # backend-rs/openapi.json). Until then this step is a live placeholder:
      # it runs the real --check when the script exists, otherwise it still
      # fails the job on an unparseable openapi.json (never silently green).
      - name: gen:api --check (placeholder until T40b wires typegen)
        run: |
          set -euo pipefail
          if npm run --prefix frontend | grep -q 'gen:api'; then
            npm run --prefix frontend gen:api -- --check
          else
            echo 'gen:api not wired yet (T40b owns it); validating openapi.json parses'
            node -e "JSON.parse(require('fs').readFileSync('backend-rs/openapi.json','utf8')); console.log('openapi.json parses OK')"
          fi

      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: vite build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist (feeds docker public/)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # --------------------------------------- docker build + :3001 e2e (pinned)
  docker-e2e:
    name: docker build (offline) + vitest + playwright pinned to :3001
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: kanpad_ci
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_pw"
          --health-interval=5s --health-timeout=3s --health-retries=20
          --health-start-period=20s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Populate backend-rs/public from frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend-rs/public

      - name: Dockerfile contract gates (no DATABASE_URL, offline flags)
        working-directory: backend-rs
        run: |
          set -euo pipefail
          if grep -v '^[[:space:]]*#' Dockerfile | grep -n 'DATABASE_URL'; then
            echo 'FAIL: Dockerfile must never reference DATABASE_URL outside comments (runtime env only)'
            exit 1
          fi
          grep -q 'SQLX_OFFLINE=true' Dockerfile || { echo 'FAIL: Dockerfile must set SQLX_OFFLINE=true'; exit 1; }
          grep -q -- '--locked --offline' Dockerfile || { echo 'FAIL: Dockerfile build must use --locked --offline'; exit 1; }
          grep -q 'COPY .sqlx' Dockerfile || { echo 'FAIL: Dockerfile must COPY .sqlx'; exit 1; }
          grep -Eq 'COPY .*public/' Dockerfile || { echo 'FAIL: Dockerfile must COPY public/ (SPA fallback)'; exit 1; }
          echo 'OK: Dockerfile contract gates pass'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SQLX_OFFLINE=true comes from the Dockerfile ENV (backed by the
      # committed .sqlx/ cache + Cargo.lock); no DATABASE_URL is passed here.
      - name: docker build backend-rs
        uses: docker/build-push-action@v6
        with:
          context: ./backend-rs
          tags: kanpad-rust:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image must not bake DATABASE_URL
        run: |
          set -euo pipefail
          if docker inspect kanpad-rust:ci --format '{{.Config.Env}}' | grep -q 'DATABASE_URL'; then
            echo 'FAIL: image bakes DATABASE_URL'
            exit 1
          fi
          echo 'OK: image carries no DATABASE_URL'

      # Serve :3001 smoke. SESSION_SECRET is runtime-only (test value, >=32
      # bytes per boot validation); DB migrations are unnecessary for this
      # smoke because /health is liveness (DB-free) and /api-docs serves the
      # embedded openapi.json. T05 adds the /ready + SPA-fallback asserts.
      - name: Serve :3001 + smoke test
        run: |
          set -euo pipefail
          docker run -d --name kanpad-rust-ci --network host \
            -e PORT=3001 \
            -e APP_ENV=test \
            -e SESSION_SECRET=ci-test-secret-that-is-longer-than-32-bytes \
            -e DATABASE_URL='mysql://root:ci_root_pw@127.0.0.1:3306/kanpad_ci?charset=utf8mb4&collation=utf8mb4_unicode_ci' \
            kanpad-rust:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "E2E_BASE_URL=http://localhost:3001" >> "$GITHUB_ENV"
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'
          echo 'OK: GET /health -> {status: ok}'
          curl -fsS http://localhost:3001/api-docs/openapi.json > /tmp/openapi.3001.json
          diff -u backend-rs/openapi.json /tmp/openapi.3001.json
          echo 'OK: /api-docs/openapi.json matches committed openapi.json'
          docker exec kanpad-rust-ci test -f /app/public/index.html
          echo 'OK: SPA index present at /app/public/index.html'
          docker stop kanpad-rust-ci && docker rm kanpad-rust-ci

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: vitest vs :3001 config (unit; needs no server)
        working-directory: frontend
        run: npm run test

      # Playwright is PINNED here, wired fully in T41/T50: browsers install
      # (cached) + the :3001 smoke above prove the target; the spec files
      # still boot Nest :3000 via webServer (playwright.config.ts), so
      # `playwright test` itself must NOT run until T41/T50 retarget it.
      - name: playwright pinned (browsers installed; full run in T41/T50)
        working-directory: frontend
        run: |
          set -euo pipefail
          npx playwright install chromium --only-shell
          npx playwright --version
          echo 'PIN: e2e target is http://localhost:3001 (full `playwright test` wired in T41/T50)'
