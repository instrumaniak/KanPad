# KanPad frontend — the compose appliance's web server (T012).
# Used ONLY by the self-host appliance (docker compose); the org's own
# production two-origin deployment uses a static host + .htaccess instead
# (see frontend/public/.htaccess and docs/deployment.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static-surface hardening — the API sets its own headers; the SPA gets
    # these here. (No CSP: the bundle uses inline styles/attributes, so a
    # policy strict enough to matter needs build-time evidence first.)
    # NOTE: nginx add_header is NOT inherited by a location that declares its
    # own add_header — every specialized location below repeats these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Vite hashes every asset under /assets/ — content-addressed, safe to
    # cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html references the hashed assets — always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # /api without a trailing slash would otherwise fall into the SPA
    # fallback below — an API-shaped path must never return text/html.
    location = /api {
        proxy_pass http://rust:3001/api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /api → rust (compose service on the default network, port 3001).
    # Path preserved: no URI part on proxy_pass.
    #
    # Pinned proxy header contract for the compose hop (same rules the
    # production reverse-proxy contract sets — see docs/deployment.md):
    #   Host $http_host        — NEVER $proxy_host (rust:3001). The CSRF
    #                            layer passes when Origin authority == effective
    #                            Host; forwarding $proxy_host breaks that.
    #   X-Forwarded-For        — $proxy_add_x_forwarded_for APPENDS the peer
    #                            (T007: append, never overwrite). rust's
    #                            TRUSTED_PROXIES is a deploy-time env var
    #                            (default empty = never trusted); set it to
    #                            your proxy's stable address if you want
    #                            per-client throttle accounting.
    #   X-Forwarded-Proto      — scheme of the client-facing request.
    # proxy_buffering off      — SSE/event streams (Wave-3 collab, MCP) must
    #                            not be buffered by the proxy.
    location /api/ {
        proxy_pass http://rust:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # (No X-Real-IP: rust keys off XFF — the append-walked rightmost
        # non-trusted entry — see backend-rs ClientIpExtractor.)
        proxy_buffering off;
    }

    # Everything else: SPA fallback (mirrors frontend/public/.htaccess
    # !-f/!-d → /index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
}
